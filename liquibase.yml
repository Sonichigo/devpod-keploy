databaseChangeLog:

  # ✅ PASSES ALL POLICIES
  - changeSet:
      id: product-table
      author: sonichigo
      context: dev
      labels: products-api
      comment: Creating product table for REST API
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  defaultValue: 0.00
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: products

  # ✅ PASSES ALL POLICIES
  - changeSet:
      id: product-table-indexes
      author: sonichigo
      context: dev
      labels: products-api
      comment: Adding indexes for the products table
      changes:
        - createIndex:
            tableName: products
            columns:
              - column:
                  name: name
            indexName: idx_product_name
      rollback:
        - dropIndex:
            indexName: idx_product_name
            tableName: products

  # ✅ PASSES ALL POLICIES
  - changeSet:
      id: product-sample-data-initial
      author: claude
      labels: products-api
      context: dev
      comment: Inserting initial sample data for development environment
      changes:
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Wireless Bluetooth Headphones"
              - column:
                  name: price
                  value: 89.99
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "USB-C Charging Cable"
              - column:
                  name: price
                  value: 15.99
      rollback:
        - delete:
            tableName: products
            where: name in ('Wireless Bluetooth Headphones', 'USB-C Charging Cable')

  # ✅ PASSES ALL POLICIES
  - changeSet:
      id: product-sample-data-electronics
      author: sonichigo
      labels: products-api
      context: dev
      comment: Inserting electronics sample data for development environment
      changes:
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Smartphone Case"
              - column:
                  name: price
                  value: 24.99
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Portable Power Bank"
              - column:
                  name: price
                  value: 45.00
      rollback:
        - delete:
            tableName: products
            where: name in ('Smartphone Case', 'Portable Power Bank')

  # ✅ PASSES ALL POLICIES
  - changeSet:
      id: product-sample-data-accessories
      author: sonichigo
      labels: products-api
      context: dev
      comment: Inserting accessories sample data for development environment
      changes:
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Wireless Mouse Pad"
              - column:
                  name: price
                  value: 12.50
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Ergonomic Laptop Stand"
              - column:
                  name: price
                  value: 65.99
      rollback:
        - delete:
            tableName: products
            where: name in ('Wireless Mouse Pad', 'Ergonomic Laptop Stand')

  # ─────────────────────────────────────────────────────────────
  # ❌ VIOLATES POLICY 1 — Table name exceeds 10 characters
  #    "product_inventory_items" = 23 chars (limit: 10)
  # ─────────────────────────────────────────────────────────────
  - changeSet:
      id: violation-table-name-too-long
      author: sonichigo
      context: dev
      labels: products-api
      comment: "OPA TEST | Policy 1 FAIL: tableName 'product_inventory_items' is 23 chars, exceeds 10 char limit"
      changes:
        - createTable:
            tableName: product_inventory_items
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: product_inventory_items

  # ─────────────────────────────────────────────────────────────
  # ❌ VIOLATES POLICY 2 — Schema name exceeds 30 characters
  #    "ecommerce_products_management_schema" = 36 chars (limit: 30)
  # ─────────────────────────────────────────────────────────────
  - changeSet:
      id: violation-schema-name-too-long
      author: sonichigo
      context: dev
      labels: products-api
      comment: "OPA TEST | Policy 2 FAIL: schema name 'ecommerce_products_management_schema' is 36 chars, exceeds 30 char limit"
      changes:
        - sql:
            sql: CREATE SCHEMA ecommerce_products_management_schema;
            comment: Schema name deliberately exceeds 30 character OPA policy limit
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS ecommerce_products_management_schema;

  # ─────────────────────────────────────────────────────────────
  # ❌ VIOLATES POLICY 3 — Direct system table access
  #    Queries pg_catalog.pg_tables (a PostgreSQL system catalog)
  # ─────────────────────────────────────────────────────────────
  - changeSet:
      id: violation-system-table-access
      author: sonichigo
      context: dev
      labels: products-api
      comment: "OPA TEST | Policy 3 FAIL: direct SELECT from pg_catalog system table"
      changes:
        - sql:
            sql: SELECT table_name FROM pg_catalog.pg_tables WHERE schemaname = 'public';
            comment: Direct system table access violates OPA policy
      rollback:
        - sql:
            sql: SELECT 1;

